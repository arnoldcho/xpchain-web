# xpchain-web — 스캐너/SQLi 차단 스니펫 (기존 Nginx server 블록에 include 용)
#
# 이미 Nginx가 80/443 을 서비스 중이므로, 전체 config 를 새로 만들지 말고
# 이 파일을 기존 server { } 안에서 include 하세요.
#
# 설치:
#   sudo cp deploy/nginx-block-scanners.conf /etc/nginx/snippets/xpchain-block-scanners.conf
#
#   (1) http 컨텍스트에 rate limit 존 한 줄 추가 — 새 파일로:
#       echo 'limit_req_zone $binary_remote_addr zone=xpchain_rl:10m rate=20r/s;' \
#         | sudo tee /etc/nginx/conf.d/xpchain-ratelimit.conf
#
#   (2) 기존 server { } (443 블록) 안 맨 위에 아래 한 줄 추가:
#       include /etc/nginx/snippets/xpchain-block-scanners.conf;
#
#   sudo nginx -t && sudo systemctl reload nginx

# --- 스캐너/봇 요청 즉시 드롭 (444 = 무응답 연결 종료, access.log 에는 남음) ---
set $bad 0;

# SQL 인젝션 페이로드 (로그의 RLIKE / DBMS_PIPE / UNION SELECT / 0x28 등)
if ($query_string ~* "(?:union[^a-z]+select|select.+from|dbms_pipe|rlike\s*\(|sleep\s*\(|benchmark\s*\(|waitfor\s+delay|information_schema|\bchr\s*\(|\bconcat\s*\(|0x[0-9a-f]{2,})") { set $bad 1; }

# Next 이미지 최적화기 url 파라미터에 따옴표/괄호/인코딩된 따옴표·괄호가 섞이면 봇.
# (union/select 등 단어는 위 query_string 규칙이 이미 전체 쿼리에서 잡으므로,
#  여기선 정상 파일명 오탐을 피하려고 특수문자만 검사한다.)
if ($arg_url ~* "['\"()<>]|%27|%22|%28|%29") { set $bad 1; }

# 흔한 취약점 스캔 경로 / 경로 traversal
if ($request_uri ~* "(?:\.\./|/etc/passwd|\bwp-login\.php\b|\bxmlrpc\.php\b|/\.env\b|/\.git/|/vendor/phpunit)") { set $bad 1; }

# 경로(path)에 SQLi 페이로드를 넣는 스캐너 차단.
# 위 규칙들은 쿼리스트링만 봤기 때문에 /en/community'%20AND%201=1 같은
# 경로형 페이로드가 그대로 Next 까지 도달했다.
# $uri 는 디코딩된 경로라 %27 도 ' 로 잡힌다. 실제 라우트/정적파일 경로는
# 전부 [A-Za-z0-9/._~-] 안에 들어오므로 화이트리스트로 판정한다.
if ($uri ~ "[^A-Za-z0-9/._~-]") { set $bad 1; }

if ($bad = 1) { return 444; }

# --- IP 당 rate limit (존은 위 conf.d 에서 http 컨텍스트에 정의) ---
limit_req zone=xpchain_rl burst=40 nodelay;
