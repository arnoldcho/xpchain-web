# fail2ban filter for xpchain-web
# Nginx access.log 에서 우리가 444 로 드롭한(=스캐너) 요청의 클라이언트 IP 를 잡는다.
# 기본 nginx combined 로그 포맷 기준:
#   $remote_addr - $remote_user [$time_local] "$request" $status ...
[Definition]
# 오직 444 만 잡는다. 444 는 우리 Nginx 스캐너 차단 스니펫만 내는 코드라
# 정상 방문자(200/304/307)는 구조적으로 밴될 수 없다. sqlmap 등은 444 를
# 수백 건 쏟아내므로 4회/60초 임계값을 즉시 넘긴다.
# ("req" 를 [^"]* 로 경계지어 greedy 매칭이 상태코드를 놓치지 않게 함.)
failregex = ^<HOST> -[^"]*"[^"]*"\s+444\s
ignoreregex =
