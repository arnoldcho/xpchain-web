# fail2ban jail for xpchain-web
# 60초 안에 차단(444/400/403)을 4회 이상 유발한 IP 를 24시간 방화벽에서 밴.
[xpchain-web]
enabled  = true
filter   = xpchain-web
# 우분투 기본 backend=systemd 는 저널만 읽어 nginx 파일 로그를 무시한다.
# 파일을 폴링하도록 강제 (status 에 'File list:' 가 떠야 정상).
backend  = polling
logpath  = /var/log/nginx/access.log
port     = http,https
maxretry = 4
findtime = 60
bantime  = 86400
action   = iptables-multiport[name=xpchain-web, port="http,https"]
